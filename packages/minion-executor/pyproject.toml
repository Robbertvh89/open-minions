[project]
name = "minion-executor"
version = "0.1.0"
description = "open-minions executor: macOS agent that pulls and runs inference subtasks"
requires-python = ">=3.12"
dependencies = [
    "minion-common",
    "httpx>=0.28",
    "structlog>=24.4",
    "typer>=0.15",
    "huggingface-hub>=1.31,<3",
]

[project.scripts]
minion-executor = "minion_executor.main:app"

[project.optional-dependencies]
mlx = [
    "mlx>=0.29",
]

[tool.uv.sources]
minion-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
