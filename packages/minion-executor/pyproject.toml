[project]
name = "minion-executor"
version = "0.1.0"
description = "open-minions executor: macOS agent that pulls and runs inference subtasks"
requires-python = ">=3.12"
dependencies = [
    "minion-common",
    "httpx>=0.28",
    "structlog>=24.4",
    "typer>=0.15",
    "huggingface-hub>=1.31,<3",
    "pyyaml>=6.0",
    # macOS signals (HID idle, thermal, Low Power Mode, IOKit power); Quartz pulls Cocoa/Foundation.
    "pyobjc-framework-Quartz>=10; sys_platform=='darwin'",
]

[project.scripts]
minion-executor = "minion_executor.main:app"

[project.optional-dependencies]
mlx = [
    "mlx==0.32.4; sys_platform=='darwin' and platform_machine=='arm64'",
    "mlx-lm==0.32.0; sys_platform=='darwin' and platform_machine=='arm64'",
]
hf = [
    "safetensors>=0.8.0; sys_platform=='darwin' and platform_machine=='arm64'",
    "torch>=2.14.1; sys_platform=='darwin' and platform_machine=='arm64'",
    "transformers>=5.20,<6; sys_platform=='darwin' and platform_machine=='arm64'",
]

[tool.uv.sources]
minion-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
