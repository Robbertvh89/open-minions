{% extends "base.html" %}
{% block title %}Log in - open-minions{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/ui/login" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>API key <input type="password" name="api_key" maxlength="256" required autofocus></label>
  <button type="submit">Log in</button>
</form>
{% endblock %}
