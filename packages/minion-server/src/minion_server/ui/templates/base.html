<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "historyCacheSize": 0, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true}'>
<title>{% block title %}open-minions{% endblock %}</title>
<link rel="stylesheet" href="/ui/static/ui.css">
<script src="/ui/static/htmx.min.js"></script>
</head>
<body>
<header>
  <a class="brand" href="/ui/tasks">open-minions</a>
  {% if user %}
  <span class="who">{{ user.name }}</span>
  <form method="post" action="/ui/logout" class="inline">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Log out</button>
  </form>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
