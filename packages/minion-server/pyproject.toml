[project]
name = "minion-server"
version = "0.1.0"
description = "open-minions server: task API, executor API, splitter"
requires-python = ">=3.12"
dependencies = [
    "minion-common",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
    "boto3>=1.43.114",
    "prometheus-client>=0.21",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
minion-server = "minion_server.app:main"
minion-server-admin = "minion_server.admin:app"

[tool.uv.sources]
minion-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
