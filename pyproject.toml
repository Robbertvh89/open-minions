[project]
name = "open-minions"
version = "0.1.0"
description = "Distributed virtual GPU cloud on idle Apple Silicon Macs (implementation of arXiv:2610.12970)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "minion-common",
    "minion-server",
    "minion-executor",
    "minion-watchdog",
    "minion-cli",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
minion-common = { workspace = true }
minion-server = { workspace = true }
minion-executor = { workspace = true }
minion-watchdog = { workspace = true }
minion-cli = { workspace = true }

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.114",
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["N999", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/migrations"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mlx/mlx_lm: optional extra, absent on Linux CI. follow_imports=skip makes the Mac (extras
# installed) and CI (absent) type-check identically instead of depending on the libs' own hints.
module = ["mlx", "mlx.*", "mlx_lm", "mlx_lm.*", "transformers", "transformers.*", "torch", "torch.*", "safetensors", "safetensors.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# pyobjc: darwin-only dependency, absent on Linux CI; skipped so both type-check identically.
module = ["Quartz", "Quartz.*", "Foundation", "Foundation.*", "objc"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (Postgres/MinIO via testcontainers)",
    "macos: needs macOS (Seatbelt sandbox); auto-skipped elsewhere",
    "gpu: needs an Apple GPU and the mlx extra (pytest -m gpu); auto-skipped unless selected/available",
    "ollama: needs a live local Ollama daemon (opt in: pytest -m ollama); auto-skipped otherwise",
    "model: downloads a real tiny model from the Hugging Face hub (opt in: pytest -m model)",
]
addopts = "--import-mode=importlib"
