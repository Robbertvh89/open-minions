# DEV ONLY - DO NOT DEPLOY. Default passwords, no TLS, ports on loopback; see docs/ARCHITECTURE.md §7.
# Local development stack. The executor runs natively on macOS (needs Metal), not in Docker.
# Server and watchdog services are added in a later milestone (ARCHITECTURE §6).
name: open-minions

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minion
      POSTGRES_PASSWORD: minion
      POSTGRES_DB: minion
      # Dev-only default. Used by deploy/postgres/initdb to create the read-only Grafana login.
      MINION_GRAFANA_DB_PASSWORD: ${MINION_GRAFANA_DB_PASSWORD:-minion-grafana-dev}
    ports:
      - "127.0.0.1:${MINION_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minion -d minion"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # S3-compatible object store (SeaweedFS). MinIO no longer publishes community images.
    image: chrislusf/seaweedfs:4.05
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=200 -master.volumePreallocate=false
    ports:
      - "127.0.0.1:${MINION_S3_PORT:-9000}:9000"
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    image: amazon/aws-cli:2.22.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minion
      AWS_SECRET_ACCESS_KEY: minion-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket minion 2>/dev/null ||
      aws --endpoint-url http://s3:9000 s3 mb s3://minion
      "

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Dev ergonomics: override with GF_SECURITY_ADMIN_PASSWORD in .env; the 'admin' default is dev only.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read by the datasource provisioning ($MINION_GRAFANA_DB_PASSWORD); dev-only default.
      MINION_GRAFANA_DB_PASSWORD: ${MINION_GRAFANA_DB_PASSWORD:-minion-grafana-dev}
    ports:
      - "127.0.0.1:${MINION_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  s3data:
