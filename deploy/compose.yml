# DEV ONLY - DO NOT DEPLOY. Default passwords, no TLS, ports on loopback; see docs/ARCHITECTURE.md §7.
# Local development stack. The executor runs natively on macOS (needs Metal), not in Docker.
# migrate/server/watchdog run from one hardened image (deploy/Dockerfile) behind the `app` profile:
#   docker compose -f deploy/compose.yml --profile app up -d --build
# Without the profile only the infrastructure starts (run `uv run minion-server` natively).
# Compose variables (MINION_SERVER_HOST_PORT, MINION_SECRETS_DIR, MINION_UI_SESSION_SECRET, ...) come
# from the shell or deploy/.env (the compose project directory is deploy/), not the repo-root .env.
name: open-minions

x-minion-app: &minion-app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: open-minions-app:dev
  profiles: [app]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "10001:10001"

x-minion-app-env: &minion-app-env
  # Explicit, no env_file: the repo-root .env points at localhost. Dev-only defaults, as above.
  MINION_DATABASE_URL: postgresql+asyncpg://minion:minion@postgres:5432/minion
  MINION_S3_ENDPOINT_URL: http://s3:9000
  # What presigned URLs carry; the host-side executor reaches S3 on the loopback port.
  MINION_S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINION_S3_PORT:-9000}
  MINION_S3_ACCESS_KEY: minion
  MINION_S3_SECRET_KEY: minion-secret

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minion
      POSTGRES_PASSWORD: minion
      POSTGRES_DB: minion
      # Dev-only default. Used by deploy/postgres/initdb to create the read-only Grafana login.
      MINION_GRAFANA_DB_PASSWORD: ${MINION_GRAFANA_DB_PASSWORD:-minion-grafana-dev}
    ports:
      - "127.0.0.1:${MINION_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during first-volume initdb the temporary server listens on the socket only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U minion -d minion"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # S3-compatible object store (SeaweedFS). MinIO no longer publishes community images.
    image: chrislusf/seaweedfs:4.05
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=200 -master.volumePreallocate=false
    ports:
      - "127.0.0.1:${MINION_S3_PORT:-9000}:9000"
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 60

  s3-init:
    image: amazon/aws-cli:2.22.0
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minion
      AWS_SECRET_ACCESS_KEY: minion-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url http://s3:9000 s3api head-bucket --bucket minion 2>/dev/null ||
      aws --endpoint-url http://s3:9000 s3 mb s3://minion
      "

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Dev ergonomics: override with GF_SECURITY_ADMIN_PASSWORD in .env; the 'admin' default is dev only.
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read by the datasource provisioning ($MINION_GRAFANA_DB_PASSWORD); dev-only default.
      MINION_GRAFANA_DB_PASSWORD: ${MINION_GRAFANA_DB_PASSWORD:-minion-grafana-dev}
    ports:
      - "127.0.0.1:${MINION_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *minion-app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *minion-app-env
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *minion-app
    command: ["minion-server"]
    environment:
      <<: *minion-app-env
      MINION_API_KEYS_FILE: /run/minion-secrets/api-keys.yaml
      # Empty = web UI off (ADR-0010).
      MINION_UI_SESSION_SECRET: ${MINION_UI_SESSION_SECRET:-}
      MINION_UI_ALLOWED_HOSTS: ${MINION_UI_ALLOWED_HOSTS:-}
      MINION_METRICS_TOKEN: ${MINION_METRICS_TOKEN:-}
    ports:
      - "127.0.0.1:${MINION_SERVER_HOST_PORT:-8080}:8080"
    volumes:
      # The directory, not the file: an atomic temp+rename replace does not reach a file bind mount.
      # Linux hosts: chown the directory and file to 10001 (auth.py refuses other owners).
      - ${MINION_SECRETS_DIR:-./secrets}:/run/minion-secrets:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  watchdog:
    <<: *minion-app
    command: ["minion-watchdog"]
    environment:
      <<: *minion-app-env
      MINION_WATCHDOG_HEALTH_FILE: /tmp/watchdog.health
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Healthy while the file is newer than 3 * interval + 30 s (a failed tick does not touch it).
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; sys.exit(time.time() - os.stat('/tmp/watchdog.health').st_mtime > 3 * float(os.environ.get('MINION_WATCHDOG_INTERVAL_S', '60')) + 30)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  s3data:
