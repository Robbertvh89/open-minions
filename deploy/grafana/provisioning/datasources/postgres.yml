apiVersion: 1
datasources:
  - name: minion-postgres
    uid: minion-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    # Read-only login: sees only the minion_ro views (migration 0007, deploy/postgres/initdb).
    user: minion_grafana
    secureJsonData:
      password: $MINION_GRAFANA_DB_PASSWORD
    jsonData:
      database: minion
      sslmode: disable
      postgresVersion: 1600
    isDefault: true
